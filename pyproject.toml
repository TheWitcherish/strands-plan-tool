[project]
name = "strands-plan-tool"
version = "0.1.1"
description = "One tool that lets a Strands agent batch a dependent tool chain into a single model round trip"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TheWitcherish" }]
keywords = ["strands", "agents", "llm", "tools", "jsonata", "latency", "workflow", "bedrock"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "jsonata-python>=0.7.0,<0.8",
    "pydantic>=2.13",
]

[project.urls]
Homepage = "https://github.com/TheWitcherish/strands-plan-tool"
Repository = "https://github.com/TheWitcherish/strands-plan-tool"
Issues = "https://github.com/TheWitcherish/strands-plan-tool/issues"

[project.optional-dependencies]
strands = [
    "strands-agents>=1.55.1",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "strands-agents>=1.55.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_plan_tool"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "ANN", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match a protocol or ABC signature exactly, so unused parameters are
# required rather than accidental.
"tests/*" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = "jsonata.*"
ignore_missing_imports = true

# Pydantic's BaseModel metaclass carries Any in its generated __init__, so the
# explicit-any check fires on every `class X(BaseModel):` line. Scoped off here only;
# it stays on for every other module, which is where it catches real Any.
[[tool.mypy.overrides]]
module = "strands_plan_tool.models"
disallow_any_explicit = false

# Only this test module reproduces SDK signatures verbatim, and those use Any. Named
# explicitly rather than globbed: mypy's per-module wildcards match whole path
# components, so a partial pattern like "test_*" silently matches nothing.
[[tool.mypy.overrides]]
module = "test_strands_adapter"
disallow_any_explicit = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Lets `uv publish --index testpypi` target the sandbox index for a rehearsal upload.
# `explicit = true` keeps it out of normal dependency resolution.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
