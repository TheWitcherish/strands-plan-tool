name: "Publish release to PyPI"

# Trusted Publishing: PyPI mints a short-lived token for this exact workflow, so no API
# token is stored anywhere -- not in repository secrets, not on a developer machine.
#
# Build and publish are deliberately separate jobs. Only `publish` holds
# `id-token: write`, so the step that compiles arbitrary project code never has access to
# a publishing credential. That split is the point, not ceremony.

on:
  push:
    tags:
      # Publish on version tags, e.g. v0.1.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # Matches how 0.1.0 was built: --no-sources proves the package builds with
      # tool.uv.sources disabled, the way any other build frontend sees it.
      - name: Build
        run: uv build --no-sources

      # An sdist ships files a wheel does not (bench/, examples/, demo scripts), so an
      # AWS account id in a comment can reach PyPI while never entering the importable
      # package. 0.1.3 shipped exactly that. Guard the artifact, not just the commit.
      - name: Scan distributions for AWS account ids
        run: uv run --isolated --no-project python scripts/scan_artifacts.py dist/*

      # Runs against the built artifacts, so a file missing from the wheel fails here
      # rather than on someone else's machine after release.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Check the README renders on PyPI
        run: uv run --isolated --no-project --with twine -- twine check dist/*

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      # No credentials configured: uv exchanges the GitHub OIDC identity for a
      # short-lived PyPI token and invalidates it afterwards.
      - name: Publish
        run: uv publish
